[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "khoade-toolkit"
version = "0.1.0"
description = "Utilitários de linha de comando do dia a dia (hash, senhas, organizar e renomear arquivos)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
khoade = "khoade_toolkit.cli:main"

[tool.setuptools]
packages = ["khoade_toolkit"]
